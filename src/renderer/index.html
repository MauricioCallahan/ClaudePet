<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>ClaudePet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span>ClaudePet</span>
      <span>
        <button id="chats-button" aria-expanded="false" aria-controls="chats">Chats</button>
        <button id="close" aria-label="Close">×</button>
      </span>
    </header>
    <main id="messages"></main>
    <section id="chats" aria-label="Chats" hidden>
      <ul id="chat-list"></ul>
    </section>
    <div id="thinking" role="status" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="2" placeholder="Message Claude…" aria-label="Message"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
